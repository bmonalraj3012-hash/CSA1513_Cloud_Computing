<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MarkDesk – Mark Sheet Processing</title>
<style>
:root{--bg:#f2f4f8;--panel:#fff;--ink:#1a2233;--mute:#667086;--line:#d9deea;--accent:#2f4bb0;--accent-ink:#fff;--ok:#1f7a45;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--panel:#171e2e;--ink:#e8ecf6;--mute:#9ba6bf;--line:#2c3650;--accent:#8aa2ff;--accent-ink:#0b1230;--ok:#6fd39a;--bad:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0f1420;--panel:#171e2e;--ink:#e8ecf6;--mute:#9ba6bf;--line:#2c3650;--accent:#8aa2ff;--accent-ink:#0b1230;--ok:#6fd39a;--bad:#ff8a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
header{padding:14px 20px;background:var(--accent);color:var(--accent-ink)}
header b{font-size:1.35rem}header small{margin-left:10px;opacity:.85}
main{max-width:1060px;margin:0 auto;padding:20px;display:grid;gap:20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{margin:0 0 14px;font-size:1.15rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--mute)}
input[type=text],input[type=number],select{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;font-weight:700;padding:9px 18px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.sm{padding:4px 10px;font-size:.82rem}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-size:.78rem;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.stat b{display:block;font-size:1.3rem}.stat span{color:var(--mute);font-size:.8rem}
.pill{padding:2px 10px;border-radius:99px;font-weight:700;font-size:.8rem;border:1px solid var(--line)}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.msg{color:var(--mute)}.err{color:var(--bad);font-weight:600}
.sheet{border:2px solid #222;padding:22px;background:#fff;color:#111;font-family:Georgia,serif}
.sheet h3{text-align:center;margin:0 0 2px}.sheet p{margin:2px 0}
.sheet table th,.sheet table td{border:1px solid #888;color:#111;text-transform:none;font-size:.9rem}
.sheet .pass{color:#14683a}.sheet .fail{color:#b02a1c}
@media print{body *{visibility:hidden}.sheet,.sheet *{visibility:visible}.sheet{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<header><b>🎓 MarkDesk</b><small>Mark sheet processing · SaaS demo</small></header>
<main>

<section aria-labelledby="a1">
<h2 id="a1">1. Class set-up</h2>
<div class="grid">
<label class="f">Institution / Department<input type="text" id="inst" value="B.Tech Computer Science"></label>
<label class="f">Semester / Exam<input type="text" id="sem" value="Semester 3 – Nov 2026"></label>
<label class="f">Maximum marks per subject<input type="number" id="max" min="10" max="200" value="100"></label>
<label class="f">Pass mark per subject<input type="number" id="pm" min="1" max="200" value="40"></label>
</div>
<label class="f" style="margin-top:12px">Subjects (separate with commas, up to 8)<input type="text" id="subs"></label>
<p id="e1" class="err" role="alert"></p>
<button id="apply">Apply subjects (clears student list)</button>
</section>

<section aria-labelledby="a2">
<h2 id="a2">2. Enter student marks</h2>
<div class="grid">
<label class="f">Name of the student<input type="text" id="nm"></label>
<label class="f">Reg no<input type="text" id="rg"></label>
</div>
<div class="grid" id="mk" style="margin-top:12px"></div>
<p id="e2" class="err" role="alert"></p>
<button id="add">Add student</button>
</section>

<section aria-labelledby="a3">
<h2 id="a3">3. Class result &amp; ranking</h2>
<div class="stats" id="stats"></div>
<div class="wrap"><table id="tbl"></table></div>
<p class="msg">Rank is given to students who pass every subject. Equal totals share a rank.</p>
</section>

<section id="shSec" hidden>
<h2>Student mark sheet</h2>
<div id="sheet" class="sheet"></div>
<p><button id="prt">Print / save as PDF</button> <button class="alt" id="cl">Close</button></p>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let subjects=["Data Structures","Database Systems","Operating Systems","Computer Networks","Discrete Mathematics"];
let students=[["Arun Kumar","192311001",[88,92,85,90,81]],["Priya Lakshmi","192311002",[95,91,89,94,97]],["Mohammed Rafi","192311003",[72,65,70,68,60]],["Divya S","192311004",[55,48,62,51,45]],["Karthik R","192311005",[38,52,45,60,41]],["Meena V","192311006",[78,80,74,83,70]]].map(s=>({name:s[0],reg:s[1],marks:s[2]}));
try{const d=JSON.parse(localStorage.getItem("mdesk")||"null");if(d){subjects=d.subjects;students=d.students;["inst","sem","max","pm"].forEach(k=>{if(d[k]!=null)$(k).value=d[k]})}}catch(e){}
const save=()=>{try{localStorage.setItem("mdesk",JSON.stringify({subjects,students,inst:$("inst").value,sem:$("sem").value,max:$("max").value,pm:$("pm").value}))}catch(e){}};
const MAX=()=>+$("max").value||100,PM=()=>+$("pm").value||40;

function grade(p){return p>=90?["O","Outstanding"]:p>=80?["A+","Excellent"]:p>=70?["A","Very Good"]:p>=60?["B+","Good"]:p>=50?["B","Average"]:p>=40?["C","Satisfactory"]:["F","Needs Improvement"]}
function calc(s){
 const total=s.marks.reduce((a,b)=>a+b,0),n=subjects.length,avg=total/n,pct=total/(n*MAX())*100;
 const failed=s.marks.some(m=>m<PM()),g=failed?["F","Fail – re-appear in "+s.marks.filter(m=>m<PM()).length+" subject(s)"]:grade(pct);
 return{total,avg,pct,failed,g};
}
function ranked(){
 const r=students.map(s=>({s,c:calc(s)}));
 const pass=r.filter(x=>!x.c.failed).sort((a,b)=>b.c.total-a.c.total);
 pass.forEach((x,i)=>{x.rank=i>0&&x.c.total===pass[i-1].c.total?pass[i-1].rank:i+1});
 return r;
}
function mkInputs(){$("mk").innerHTML=subjects.map((s,i)=>`<label class="f">${esc(s)} (max ${MAX()})<input type="number" class="mi" min="0" max="${MAX()}" data-i="${i}"></label>`).join("")}
$("apply").onclick=()=>{
 const l=$("subs").value.split(",").map(x=>x.trim()).filter(Boolean);
 if(l.length<1||l.length>8)return $("e1").textContent="Enter 1 to 8 subjects.";
 if(new Set(l.map(x=>x.toLowerCase())).size!==l.length)return $("e1").textContent="Subject names must be different.";
 if(PM()>MAX())return $("e1").textContent="Pass mark cannot exceed maximum marks.";
 $("e1").textContent="";subjects=l;students=[];save();mkInputs();render();
};
$("max").oninput=$("pm").oninput=()=>{mkInputs();render();save()};
$("inst").oninput=$("sem").oninput=save;
$("add").onclick=()=>{
 const nm=$("nm").value.trim(),rg=$("rg").value.trim().toUpperCase(),ins=[...document.querySelectorAll(".mi")];
 if(nm.length<2||rg.length<3)return $("e2").textContent="Enter student name and reg no.";
 if(students.some(s=>s.reg===rg))return $("e2").textContent="This reg no already exists.";
 if(ins.some(i=>i.value===""))return $("e2").textContent="Enter marks for every subject (use 0 for absent).";
 const m=ins.map(i=>+i.value);
 if(m.some(v=>v<0||v>MAX()))return $("e2").textContent=`Marks must be between 0 and ${MAX()}.`;
 $("e2").textContent="";students.push({name:nm,reg:rg,marks:m});save();
 $("nm").value=$("rg").value="";ins.forEach(i=>i.value="");render();
};
function render(){
 const r=ranked();
 const n=r.length,pass=r.filter(x=>!x.c.failed).length,top=r.filter(x=>x.rank===1);
 $("stats").innerHTML=n?`<div class="stat"><b>${n}</b><span>Students</span></div><div class="stat"><b>${(pass/n*100).toFixed(0)}%</b><span>Pass percentage</span></div><div class="stat"><b>${(r.reduce((a,x)=>a+x.c.pct,0)/n).toFixed(1)}%</b><span>Class average</span></div><div class="stat"><b>${top.length?esc(top.map(x=>x.s.name).join(", ")):"–"}</b><span>Topper</span></div>`:"";
 $("tbl").innerHTML=n?`<thead><tr><th>Rank</th><th>Name</th><th>Reg no</th>${subjects.map(s=>`<th>${esc(s)}</th>`).join("")}<th>Total / ${subjects.length*MAX()}</th><th>Average</th><th>Percentage</th><th>Grade</th><th>Result</th><th>Overall performance</th><th></th></tr></thead><tbody>${[...r].sort((a,b)=>(a.rank||999)-(b.rank||999)||b.c.total-a.c.total).map(x=>{const i=students.indexOf(x.s);
  return `<tr><td><b>${x.rank||"–"}</b></td><td>${esc(x.s.name)}</td><td>${esc(x.s.reg)}</td>${x.s.marks.map(m=>`<td class="${m<PM()?"fail":""}">${m}</td>`).join("")}<td>${x.c.total}</td><td>${x.c.avg.toFixed(1)}</td><td>${x.c.pct.toFixed(2)}%</td><td>${x.c.g[0]}</td><td class="${x.c.failed?"fail":"pass"}"><b>${x.c.failed?"FAIL":"PASS"}</b></td><td>${x.c.g[1]}</td><td><button class="sm" data-v="${i}">Mark sheet</button> <button class="sm alt" data-d="${i}">Delete</button></td></tr>`}).join("")}</tbody>`:'<tbody><tr><td class="msg">No students yet. Add one above.</td></tr></tbody>';
 $("tbl").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>sheet(+b.dataset.v));
 $("tbl").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{students.splice(+b.dataset.d,1);save();$("shSec").hidden=true;render()});
}
function sheet(i){
 const s=students[i],c=calc(s),rk=ranked().find(x=>x.s===s).rank;
 $("sheet").innerHTML=`<h3>${esc($("inst").value)}</h3><p style="text-align:center">STATEMENT OF MARKS · ${esc($("sem").value)}</p><hr>
 <p><b>Name:</b> ${esc(s.name)} &nbsp;&nbsp; <b>Reg no:</b> ${esc(s.reg)}</p>
 <table><thead><tr><th>#</th><th>Subject</th><th>Max</th><th>Marks</th><th>Result</th></tr></thead><tbody>${subjects.map((x,j)=>`<tr><td>${j+1}</td><td>${esc(x)}</td><td>${MAX()}</td><td>${s.marks[j]}</td><td class="${s.marks[j]<PM()?"fail":"pass"}">${s.marks[j]<PM()?"Fail":"Pass"}</td></tr>`).join("")}
 <tr><td colspan="2"><b>Total</b></td><td>${subjects.length*MAX()}</td><td colspan="2"><b>${c.total}</b></td></tr></tbody></table>
 <p style="margin-top:10px"><b>Average:</b> ${c.avg.toFixed(2)} &nbsp; <b>Percentage:</b> ${c.pct.toFixed(2)}% &nbsp; <b>Grade:</b> ${c.g[0]} &nbsp; <b>Class rank:</b> ${rk||"–"}</p>
 <p><b>Result:</b> <span class="${c.failed?"fail":"pass"}">${c.failed?"FAIL":"PASS"}</span> &nbsp; <b>Overall performance:</b> ${c.g[1]}</p>
 <p style="margin-top:34px">Class Teacher: ____________ &nbsp;&nbsp;&nbsp; Controller of Examinations: ____________</p>`;
 $("shSec").hidden=false;$("shSec").scrollIntoView({behavior:"smooth"});
}
$("prt").onclick=()=>window.print();$("cl").onclick=()=>{$("shSec").hidden=true};
$("subs").value=subjects.join(", ");mkInputs();render();
</script>
</body>
</html>
